openapi: "3.0.3"
info:
  title: Hello World API
  version: "1.0.0"
paths:
  /greetings:
    get:
      operationId: listGreetings
      parameters:
        # No default: an absent `language` means "don't filter", which a
        # default would quietly turn into "filter by en".
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A list of greetings
    post:
      operationId: createGreeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGreetingRequest"
      responses:
        "201":
          description: The created greeting
components:
  schemas:
    Greeting:
      type: object
      required: [id, message, language, created_at]
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
          minLength: 1
          maxLength: 280
        language:
          type: string
          enum:
            - en
            - de
            - fr
        created_at:
          type: string
          format: date-time
        expires_on:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
          maxItems: 10
          uniqueItems: true
        attachment:
          $ref: "#/components/schemas/Attachment"

    CreateGreetingRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 280
        language:
          type: string
          enum:
            - en
            - de
            - fr
          default: en
        expires_on:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
          maxItems: 10
          uniqueItems: true
        delivery:
          $ref: "#/components/schemas/DeliveryChannel"

    # Tagged oneOf: how the greeting should be delivered. The `channel`
    # property discriminates which member applies, and `mapping` gives the
    # wire values used in the payload.
    DeliveryChannel:
      oneOf:
        - $ref: "#/components/schemas/EmailDelivery"
        - $ref: "#/components/schemas/SmsDelivery"
      discriminator:
        propertyName: channel
        mapping:
          email: "#/components/schemas/EmailDelivery"
          sms: "#/components/schemas/SmsDelivery"

    EmailDelivery:
      type: object
      required: [channel, address]
      properties:
        channel:
          type: string
        address:
          type: string
          minLength: 3

    SmsDelivery:
      type: object
      required: [channel, phone_number]
      properties:
        channel:
          type: string
        phone_number:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'

    # Untagged oneOf: an optional attachment is either an image or a link.
    # With no discriminator, deserialization tries each member in order.
    Attachment:
      oneOf:
        - $ref: "#/components/schemas/ImageAttachment"
        - $ref: "#/components/schemas/LinkAttachment"

    ImageAttachment:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32

    LinkAttachment:
      type: object
      required: [href]
      properties:
        href:
          type: string
        title:
          type: string
